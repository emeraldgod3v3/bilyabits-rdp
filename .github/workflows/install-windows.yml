name: Windows RDP Desktop

on:
  workflow_dispatch:
    inputs:
      phone_tailscale_ip:
        description: Your phone's Tailscale IPv4 address
        required: true
        type: string
      session_minutes:
        description: Desktop time in minutes, from 5 to 360
        required: true
        default: '30'
        type: string

permissions:
  contents: read

concurrency:
  group: windows-rdp-debug
  cancel-in-progress: false

jobs:
  desktop:
    runs-on: windows-2025
    timeout-minutes: 360

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check connection settings
        env:
          PHONE_IP: ${{ inputs.phone_tailscale_ip }}
          SESSION_MINUTES: ${{ inputs.session_minutes }}
        run: |
          $phoneInput = ([string]$env:PHONE_IP).Trim()
          $phoneIP = $null

          if (-not [ipaddress]::TryParse($phoneInput, [ref]$phoneIP) -or
              $phoneIP.AddressFamily -ne [System.Net.Sockets.AddressFamily]::InterNetwork -or
              $phoneIP.ToString() -ne $phoneInput) {
            throw 'Enter the IPv4 address shown for your phone in Tailscale.'
          }

          $octets = $phoneIP.GetAddressBytes()
          if ($octets[0] -ne 100 -or
              $octets[1] -lt 64 -or
              $octets[1] -gt 127) {
            throw 'Use your phone Tailscale address in the 100.64.0.0/10 range.'
          }

          $minutes = 0
          if (-not [int]::TryParse($env:SESSION_MINUTES, [ref]$minutes) -or
              $minutes -lt 5 -or
              $minutes -gt 360) {
            throw 'Enter a whole number from 5 to 360.'
          }

          $deadline = [DateTimeOffset]::UtcNow.AddMinutes(355)

          "RDP_JOB_DEADLINE=$($deadline.ToString('o'))" >> $env:GITHUB_ENV
          "RDP_PHONE_IP=$phoneIP" >> $env:GITHUB_ENV
          "RDP_SESSION_MINUTES=$minutes" >> $env:GITHUB_ENV

      - name: Check out the project
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Install Tailscale
        timeout-minutes: 5
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'tailscale-amd64.msi'
          $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.104.5-amd64.msi'

          Invoke-WebRequest -Uri $url -OutFile $msi -TimeoutSec 90

          $signature = Get-AuthenticodeSignature -FilePath $msi
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -notmatch '\bTailscale\b') {
            throw 'Tailscale installer signature verification failed.'
          }

          $installer = Start-Process -FilePath 'msiexec.exe' -Wait -PassThru -ArgumentList @(
            '/i', ('"{0}"' -f $msi), '/qn', '/norestart', 'TS_NOLAUNCH=1'
          )

          if ($installer.ExitCode -ne 0) {
            throw "Tailscale installation failed with code $($installer.ExitCode)."
          }

          Remove-Item -LiteralPath $msi

      - name: Install command elevation support
        timeout-minutes: 5
        run: |
          choco install gsudo --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) {
            throw "gsudo installation failed with code $LASTEXITCODE."
          }

          # Refresh PATH for verification in this workflow step.
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $env:Path = "$machinePath;$env:Path"

          $gsudo = Get-Command gsudo.exe -ErrorAction Stop
          & $gsudo.Source --version

          if ($LASTEXITCODE -ne 0) {
            throw 'gsudo verification failed.'
          }

      - name: Check Windows Test Mode
        run: |
          $bootSettings = & bcdedit.exe /enum '{current}' 2>&1

          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'Could not read the Windows boot configuration.'
          } elseif (($bootSettings -join "`n") -match '(?im)^\s*testsigning\s+Yes\s*$') {
            & bcdedit.exe /set '{current}' testsigning off

            if ($LASTEXITCODE -eq 0) {
              Write-Warning 'Test signing is set to OFF. Windows requires a reboot to apply this change.'
            } else {
              Write-Warning 'Windows did not allow the test-signing setting to be changed.'
            }
          } else {
            Write-Host 'The current boot entry has no enabled test-signing flag.'
          }

          exit 0

      - name: Enable wallpaper and prepare desktop
        run: |
          # Allow wallpaper in new RDP sessions.
          $rdpPolicy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item -Path $rdpPolicy -Force | Out-Null

          New-ItemProperty -Path $rdpPolicy `
            -Name fNoRemoteDesktopWallpaper `
            -PropertyType DWord -Value 0 -Force | Out-Null

          Set-Service -Name Themes -StartupType Automatic
          Start-Service -Name Themes

          # Run the user settings inside the RDP user's own session.
          $configDirectory = Join-Path $env:ProgramData 'RdpDesktop'
          New-Item -Path $configDirectory -ItemType Directory -Force | Out-Null

          $scriptPath = Join-Path $configDirectory 'Initialize-Desktop.ps1'

          @'
          $ErrorActionPreference = 'Stop'

          if ($env:USERNAME -ne 'rdpdebug') {
            exit
          }

          $marker = 'HKCU:\Software\RdpDesktop'
          if (Test-Path -LiteralPath $marker) {
            exit
          }

          # Remove wallpaper restrictions from this user's profile.
          $activeDesktop = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\ActiveDesktop'
          Remove-ItemProperty -Path $activeDesktop `
            -Name NoChangingWallPaper -ErrorAction SilentlyContinue

          $systemPolicy = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\System'
          foreach ($name in @('Wallpaper', 'WallpaperStyle', 'NoDispBackgroundPage')) {
            Remove-ItemProperty -Path $systemPolicy `
              -Name $name -ErrorAction SilentlyContinue
          }

          # Select an existing Windows wallpaper for the first sign-in.
          $wallpaperDirectory = Join-Path $env:WINDIR 'Web\Wallpaper'
          $wallpaper = Get-ChildItem -Path $wallpaperDirectory -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.jpg', '.jpeg', '.bmp' } |
            Select-Object -First 1

          if ($wallpaper) {
            $desktop = 'HKCU:\Control Panel\Desktop'
            Set-ItemProperty -Path $desktop -Name WallpaperStyle -Value '10'
            Set-ItemProperty -Path $desktop -Name TileWallpaper -Value '0'

            Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public static class DesktopWallpaper
          {
              [DllImport("user32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool SystemParametersInfo(
                  uint action, uint parameter, string value, uint flags);
          }
          "@

            $applied = [DesktopWallpaper]::SystemParametersInfo(
              20, 0, $wallpaper.FullName, 3
            )

            if (-not $applied) {
              throw 'Windows could not apply the wallpaper.'
            }
          }

          # Apply the defaults once so later wallpaper changes are preserved.
          New-Item -Path $marker -Force | Out-Null
          '@ | Set-Content -LiteralPath $scriptPath -Encoding UTF8

          $startup = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
          New-Item -Path $startup -Force | Out-Null

          $powershell = Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $startupCommand = '"{0}" -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{1}"' -f $powershell, $scriptPath

          New-ItemProperty -Path $startup `
            -Name InitializeRdpDesktop `
            -PropertyType String -Value $startupCommand -Force | Out-Null

      - name: Enable private RDP
        timeout-minutes: 5
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw 'Set the TAILSCALE_AUTHKEY repository secret.'
          }

          $password = [string]$env:RDP_PASSWORD
          if ($password.Length -lt 20 -or
              $password.Length -gt 127 -or
              $password -cnotmatch '[A-Z]' -or
              $password -cnotmatch '[a-z]' -or
              $password -notmatch '[0-9]' -or
              $password -notmatch '[^A-Za-z0-9\s]' -or
              $password -match 'rdpdebug') {
            throw 'RDP_PASSWORD must contain 20–127 characters with uppercase, lowercase, a digit, and a symbol. Avoid rdpdebug.'
          }

          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          Remove-Item Env:RDP_PASSWORD
          Remove-Variable password

          $tailscale = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          Start-Service -Name Tailscale

          $keyFile = Join-Path $env:RUNNER_TEMP ("rdp-tailnet-{0}.key" -f [guid]::NewGuid())

          try {
            [IO.File]::WriteAllText($keyFile, $env:TAILSCALE_AUTHKEY.Trim())
            Remove-Item Env:TAILSCALE_AUTHKEY

            $hostname = "gh-rdp-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

            & $tailscale up "--auth-key=file:$keyFile" `
              --unattended `
              --accept-dns=false `
              --accept-routes=false `
              --shields-up=false `
              "--hostname=$hostname" `
              --timeout=90s

            if ($LASTEXITCODE -ne 0) {
              throw 'Tailscale sign-in failed. Check your auth key and device approval.'
            }
          } finally {
            Remove-Item -LiteralPath $keyFile -Force -ErrorAction SilentlyContinue
          }

          $addresses = & $tailscale ip -4
          if ($LASTEXITCODE -ne 0 -or -not $addresses) {
            throw 'Tailscale did not assign an IPv4 address.'
          }

          $runnerIP = ([string]($addresses | Select-Object -First 1)).Trim()
          $adapterDeadline = [DateTimeOffset]::UtcNow.AddSeconds(30)

          do {
            $adapter = Get-NetIPAddress -IPAddress $runnerIP `
              -AddressFamily IPv4 -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($adapter) {
              break
            }

            Start-Sleep -Seconds 2
          } while ([DateTimeOffset]::UtcNow -lt $adapterDeadline)

          if (-not $adapter) {
            throw 'The Tailscale adapter did not come online.'
          }

          $user = New-LocalUser -Name rdpdebug `
            -Password $securePassword `
            -Description 'Temporary Windows project debugging account'

          Add-LocalGroupMember -SID 'S-1-5-32-544' -Member $user
          Add-LocalGroupMember -SID 'S-1-5-32-555' -Member $user

          Set-NetFirewallProfile -Profile Domain,Private,Public `
            -Enabled True -DefaultInboundAction Block

          Get-NetFirewallRule -Name 'RemoteDesktop*' -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule

          $firewallRule = @{
            Name = 'ProjectDebugRdp'
            DisplayName = 'Project RDP through Tailscale'
            Direction = 'Inbound'
            Action = 'Allow'
            Profile = 'Any'
            Protocol = 'TCP'
            LocalPort = 3389
            InterfaceAlias = $adapter.InterfaceAlias
            LocalAddress = $runnerIP
            RemoteAddress = $env:RDP_PHONE_IP
          }

          New-NetFirewallRule @firewallRule | Out-Null

          $terminalServer = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'

          Set-ItemProperty -LiteralPath $terminalServer `
            -Name fDenyTSConnections -Value 0

          Set-ItemProperty -LiteralPath "$terminalServer\WinStations\RDP-Tcp" `
            -Name UserAuthentication -Value 1

          Restart-Service -Name TermService -Force

          $listenerDeadline = [DateTimeOffset]::UtcNow.AddSeconds(45)

          while (-not (Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue)) {
            if ([DateTimeOffset]::UtcNow -ge $listenerDeadline) {
              throw 'Remote Desktop Services did not open port 3389.'
            }

            Start-Sleep -Seconds 2
          }

          "RDP_RUNNER_IP=$runnerIP" >> $env:GITHUB_ENV

      - name: Show connection details and hold session
        run: |
          $deadline = [DateTimeOffset]::UtcNow.AddMinutes([int]$env:RDP_SESSION_MINUTES)
          $jobDeadline = [DateTimeOffset]::Parse($env:RDP_JOB_DEADLINE)

          if ($deadline -gt $jobDeadline) {
            $deadline = $jobDeadline
          }

          $username = "$env:COMPUTERNAME\rdpdebug"

          Write-Host "PC address: $($env:RDP_RUNNER_IP):3389"
          Write-Host "Username: $username"
          Write-Host 'Password: Your RDP_PASSWORD repository secret'
          Write-Host "Scheduled end: $($deadline.ToString('u'))"
          Write-Host "Project folder: $env:GITHUB_WORKSPACE"
          Write-Host 'For elevated Windows commands, use gsudo.'
          Write-Host 'Keep Tailscale connected. Cancel this run when finished.'

          while ([DateTimeOffset]::UtcNow -lt $deadline) {
            Start-Sleep -Seconds 5
          }

      - name: Close RDP and sign out
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          Remove-NetFirewallRule -Name ProjectDebugRdp -ErrorAction SilentlyContinue

          if (Get-LocalUser -Name rdpdebug -ErrorAction SilentlyContinue) {
            Disable-LocalUser -Name rdpdebug -ErrorAction SilentlyContinue
          }

          $tailscale = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'

          if (Test-Path -LiteralPath $tailscale) {
            & $tailscale logout
          }

          exit 0
